<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>النشاطات · م. عماد شنب</title>
<meta name="theme-color" content="#EDF2F4">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="sub.css?v=1.1">
</head>
<body data-page="activity">
<main id="main">
  <header class="phead"><div class="wrap in"><nav class="trail" id="pageTrail" aria-label="أنت هنا"></nav><div class="meta" id="meta"></div><h1 id="t">…</h1></div></header>
  <section style="padding-top:0"><div class="wrap" id="box"><div class="sk"></div></div></section>
</main>
<div class="next" id="next"></div>

<script src="site-config.js?v=1.1"></script>
<script src="act-data.js?v=1.1"></script>
<script src="roles-data.js?v=1.1"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script defer src="sub.js?v=1.1"></script>
<script>
window.PAGE = function(){
  var id = Y.param("id");
  Y.nextChapter(document.getElementById("next"), "activities", "مقالاته عن الشباب والسلام والحوار والمصالحة في ليبيا.");
  return Y.load("activities").then(function(D){
    var art = D.activities.filter(function(a){ return a.k === "article" && String(a.id) === String(id); })[0];
    if (art){ location.replace("article.html?id=" + art.id); return; }
    var A = D.activities.filter(function(a){ return a.k !== "article"; }).sort(function(a, b){ return b.date.localeCompare(a.date); });
    var i = A.map(function(a){ return String(a.id); }).indexOf(String(id)), a = A[i];
    if (!a){
      document.title = "غير موجود · م. عماد شنب";
      Y.trail(document.getElementById("pageTrail"), [{t:"النشاطات", href:"activities.html"}, {t:"غير موجود"}]);
      document.getElementById("t").textContent = "هذا النشاط غير موجود";
      document.getElementById("box").innerHTML = '<div class="glass empty"><p>ربما تغيّر الرابط. كل النشاطات مرتبة بتواريخها في صفحة النشاطات.</p><p style="margin-top:14px"><a class="btn solid" href="activities.html">إلى النشاطات</a></p></div>';
      return;
    }
    document.title = a.t + " · م. عماد شنب";
    Y.trail(document.getElementById("pageTrail"), [{t:"النشاطات", href:"activities.html"}, {t:a.t}]);
    document.getElementById("meta").innerHTML = '<span class="chip">' + Y.KINDS[a.k] + '</span><span class="date">' + Y.date(a.date) + '</span>';
    document.getElementById("t").textContent = a.t;
    var newer = A[i - 1], older = A[i + 1];
    var vid = a.vid ? (a.vid.yt ? '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + a.vid.yt + '" title="' + Y.esc(a.t) + '" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>'
                                : '<a class="btn soft" href="' + Y.esc(a.vid.fb) + '" target="_blank" rel="noopener">مشاهدة الفيديو على فيسبوك</a>') : '';
    var body = a.p.length ? a.p.map(function(p){ return '<p>' + Y.esc(p) + '</p>'; }).join("") : '<p style="color:var(--ink-2)">' + (a.img.length > 1 ? "صور من النشاط." : "") + '</p>';
    var gal = a.img.length > 1 ? '<div class="gal" id="gal">' + a.img.slice(1).map(function(im, k){ return '<button type="button" data-i="' + (k + 1) + '" aria-label="فتح الصورة ' + (k + 2) + ' من ' + a.img.length + '">' + Y.pic(im, "(max-width:900px) 33vw, 15vw", "") + '</button>'; }).join("") + '</div>' : '';
    document.getElementById("box").innerHTML = (a.img[0] ? '<div class="cover rv"><button type="button" data-i="0" style="all:unset;display:block;cursor:zoom-in;width:100%" aria-label="تكبير الصورة">' + Y.pic(a.img[0], "(max-width:1200px) 100vw, 1200px", a.t, true) + '</button></div>' : '')
      + '<div class="item"><div class="body glass rv">' + body + vid + gal + '</div>'
      + '<aside class="aside glass rv"><dl><div><dt>التاريخ</dt><dd>' + Y.date(a.date) + '</dd></div><div><dt>النوع</dt><dd>' + Y.KINDS[a.k] + '</dd></div>' + (a.img.length ? '<div><dt>الصور</dt><dd>' + Y.n(a.img.length, "صورة", "صور") + '</dd></div>' : '') + '</dl>'
      + (newer ? '<a class="more" href="activity.html?id=' + newer.id + '">الأحدث: ' + Y.esc(newer.t) + ' ' + Y.ARROW + '</a>' : '')
      + (older ? '<a class="more" href="activity.html?id=' + older.id + '">الأقدم: ' + Y.esc(older.t) + ' ' + Y.ARROW + '</a>' : '')
      + '<a class="more" href="activities.html">كل النشاطات ' + Y.ARROW + '</a></aside></div>';
    if (a.img.length) Y.gallery(document.getElementById("box"), a.img, a.t);
  });
};
</script>
</body>
</html>

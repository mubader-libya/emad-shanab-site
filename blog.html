<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المدونة · م. عماد شنب</title>
<meta name="description" content="مقالات م. عماد شنب: الشباب والسلام والحوار والمصالحة في ليبيا.">
<meta name="theme-color" content="#EDF2F4">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="sub.css?v=1.1">
</head>
<body data-page="blog">
<main id="main">
  <header class="phead">
    <div class="wrap in">
      <nav class="trail" id="pageTrail" aria-label="أنت هنا"></nav>
      <h1>المدونة</h1>
      <p class="lead">ما كتبه م. عماد شنب عن الشباب والسلام والحوار والمصالحة في ليبيا، الأحدث أولاً.</p>
    </div>
  </header>
  <section style="padding-top:0">
    <div class="wrap">
      <div id="lead"><div class="sk"></div></div>
      <div class="arts" id="arts"></div>
    </div>
  </section>
</main>
<div class="next" id="next"></div>

<script src="site-config.js?v=1.1"></script>
<script src="act-data.js?v=1.1"></script>
<script src="roles-data.js?v=1.1"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script defer src="sub.js?v=1.1"></script>
<script>
window.PAGE = function(){
  Y.trail(document.getElementById("pageTrail"), [{t:"المدونة"}]);
  Y.nextChapter(document.getElementById("next"), "blog", "من هو م. عماد شنب، وأدواره اليوم، في صفحة واحدة.");
  return Y.load("activities").then(function(D){
    var A = D.activities.filter(function(a){ return a.k === "article"; }).sort(function(a, b){ return b.date.localeCompare(a.date); });
    var meta = function(a){ return '<div class="meta"><span class="date">' + Y.date(a.date) + '</span><span class="rt">· ' + Y.readTime(a) + '</span></div>'; };
    if (!A.length){ document.getElementById("lead").innerHTML = '<div class="glass empty"><p>لا مقالات منشورة بعد.</p></div>'; return; }
    var f = A[0];
    document.getElementById("lead").innerHTML = '<a class="lead-art glass rv" href="article.html?id=' + f.id + '"><div class="ph">' + (f.img[0] ? Y.pic(f.img[0], "(max-width:820px) 100vw, 55vw", f.t, true) : '<div class="noimg">' + Y.esc(f.t) + '</div>') + '</div>'
      + '<div class="tx">' + meta(f) + '<h2>' + Y.esc(f.t) + '</h2><p>' + Y.esc(Y.excerpt(f, 220)) + '</p><span class="more">اقرأ المقال ' + Y.ARROW + '</span></div></a>';
    document.getElementById("arts").innerHTML = A.slice(1).map(function(a){
      return '<a class="art glass rv" href="article.html?id=' + a.id + '"><div class="tx">' + meta(a) + '<h3>' + Y.esc(a.t) + '</h3><p>' + Y.esc(Y.excerpt(a)) + '</p></div>'
        + '<div class="ph">' + (a.img[0] ? Y.pic(a.img[0], "(max-width:620px) 100vw, 200px", "") : '<div class="noimg">' + Y.esc(a.t) + '</div>') + '</div></a>';
    }).join("");
  });
};
</script>
</body>
</html>
